<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
  <defs>
    <filter id="flk"><feComponentTransfer><feFuncR type="linear" slope="1"><animate attributeName="slope" values="1;0.92;1;0.95;1;0.93;1" dur="0.4s" repeatCount="indefinite"/></feFuncR><feFuncG type="linear" slope="1"><animate attributeName="slope" values="1;0.92;1;0.95;1;0.93;1" dur="0.4s" repeatCount="indefinite"/></feFuncG><feFuncB type="linear" slope="1"><animate attributeName="slope" values="1;0.92;1;0.95;1;0.93;1" dur="0.4s" repeatCount="indefinite"/></feFuncB></feComponentTransfer></filter>
    <filter id="grn"><feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feBlend in="SourceGraphic" mode="multiply"/></filter>
    <filter id="haze"><feTurbulence type="turbulence" baseFrequency="0.01 0.05" numOctaves="2" seed="7" result="h"><animate attributeName="baseFrequency" values="0.01 0.05;0.013 0.06;0.01 0.05" dur="5s" repeatCount="indefinite"/></feTurbulence><feDisplacementMap in="SourceGraphic" in2="h" scale="4" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="vig" cx="50%" cy="50%" r="48%"><stop offset="0%" stop-color="#000" stop-opacity="0"/><stop offset="55%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity="0.8"/></radialGradient>
    <radialGradient id="sun" cx="50%" cy="5%" r="40%"><stop offset="0%" stop-color="#d4c5a0" stop-opacity="0.12"/><stop offset="100%" stop-color="#0c0a08" stop-opacity="0"/></radialGradient>
  </defs>

  <g filter="url(#flk)">
    <!-- SKY -->
    <rect width="900" height="360" fill="#0c0a08"/>
    <rect width="900" height="360" fill="url(#sun)"/>

    <!-- DISTANT MESAS -->
    <polygon points="0,255 40,195 90,205 150,170 210,200 280,255" fill="#13110d" opacity="0.6"/>
    <polygon points="620,255 680,185 740,165 800,180 850,195 900,210 900,255" fill="#13110d" opacity="0.5"/>
    <polygon points="350,255 390,210 430,200 470,213 510,255" fill="#13110d" opacity="0.35"/>

    <!-- Heat shimmer -->
    <g filter="url(#haze)" opacity="0.1">
      <line x1="0" y1="243" x2="900" y2="243" stroke="#a89770" stroke-width="0.4"/>
      <line x1="0" y1="247" x2="900" y2="247" stroke="#a89770" stroke-width="0.3"/>
      <line x1="0" y1="251" x2="900" y2="251" stroke="#a89770" stroke-width="0.3"/>
    </g>

    <!-- GROUND -->
    <line x1="0" y1="255" x2="900" y2="255" stroke="#2a2218" stroke-width="1"/>
    <rect x="0" y="255" width="900" height="105" fill="#110f0b"/>
    <line x1="100" y1="270" x2="130" y2="265" stroke="#1a1510" stroke-width="0.4"/>
    <line x1="400" y1="275" x2="440" y2="270" stroke="#1a1510" stroke-width="0.3"/>
    <line x1="700" y1="267" x2="730" y2="273" stroke="#1a1510" stroke-width="0.4"/>

    <!-- ═══════════════════════════════════════════════ -->
    <!-- LEFT — THE DEVELOPER (PRINCE) — THE WINNER     -->
    <!-- ═══════════════════════════════════════════════ -->
    <g transform="translate(200, 0)">
      <!-- Shadow -->
      <ellipse cx="0" cy="258" rx="40" ry="5" fill="#000" opacity="0.35"/>

      <!-- Boots -->
      <rect x="-15" y="237" width="9" height="20" rx="1.5" fill="#1a1510"/>
      <rect x="6" y="237" width="9" height="20" rx="1.5" fill="#1a1510"/>
      <circle cx="-10" cy="255" r="2.5" fill="#3d3425" opacity="0.5"/>
      <circle cx="11" cy="255" r="2.5" fill="#3d3425" opacity="0.5"/>

      <!-- Legs -->
      <rect x="-13" y="201" width="8" height="38" rx="1.5" fill="#2a2218"/>
      <rect x="5" y="201" width="8" height="38" rx="1.5" fill="#2a2218"/>

      <!-- Belt -->
      <rect x="-20" y="197" width="40" height="6" rx="1.5" fill="#3d3425"/>
      <rect x="-4" y="198" width="8" height="4" rx="1" fill="#6b5c3e"/>

      <!-- Torso -->
      <rect x="-16" y="155" width="32" height="44" rx="5" fill="#2a2218"/>

      <!-- Duster coat -->
      <polygon points="-32,163 32,163 38,205 28,240 -28,240 -38,205" fill="#1a1510" opacity="0.75"/>
      <line x1="-12" y1="167" x2="-24" y2="230" stroke="#2a2218" stroke-width="0.4" opacity="0.3"/>
      <line x1="12" y1="167" x2="24" y2="230" stroke="#2a2218" stroke-width="0.4" opacity="0.3"/>

      <!-- LEFT arm — hanging relaxed at side -->
      <line x1="-16" y1="165" x2="-34" y2="193" stroke="#2a2218" stroke-width="6" stroke-linecap="round"/>
      <line x1="-34" y1="193" x2="-28" y2="203" stroke="#2a2218" stroke-width="5" stroke-linecap="round"/>

      <!-- RIGHT ARM — AIMING RIGHT (toward the AI) -->
      <!-- Upper arm goes right -->
      <line x1="16" y1="165" x2="38" y2="160" stroke="#2a2218" stroke-width="6" stroke-linecap="round"/>
      <!-- Forearm aims right, draws up to aim, then fires -->
      <line x1="38" y1="160" x2="56" y2="155" stroke="#2a2218" stroke-width="5" stroke-linecap="round">
        <!-- Arm extends RIGHT toward AI -->
        <animate attributeName="x2" values="56;62;70;70;70;70;62;56" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="155;148;140;140;140;140;148;155" dur="8s" repeatCount="indefinite"/>
      </line>

      <!-- PISTOL — facing RIGHT →→→ -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0;6,-7;14,-15;14,-15;14,-15;14,-15;6,-7;0,0" dur="8s" repeatCount="indefinite"/>
        <!-- Gun body -->
        <rect x="54" y="150" width="20" height="7" rx="1.5" fill="#3d3425"/>
        <!-- Barrel pointing RIGHT -->
        <rect x="72" y="151" width="18" height="5" rx="0.5" fill="#2a2218"/>
        <!-- Grip -->
        <rect x="55" y="156" width="7" height="12" rx="1.5" fill="#1a1510"/>
      </g>

      <!-- MUZZLE FLASH — fires RIGHT toward AI -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;0;0.9;1;0;0;0" dur="8s" repeatCount="indefinite"/>
        <!-- Flash at gun barrel tip (to the RIGHT) -->
        <circle cx="106" cy="138" r="12" fill="#d4c5a0" opacity="0.6" filter="url(#glow)">
          <animate attributeName="r" values="8;16;8" dur="0.12s" repeatCount="indefinite"/>
        </circle>
        <circle cx="106" cy="138" r="5" fill="#fff" opacity="0.9"/>
        <!-- Flash lines going RIGHT →→ -->
        <line x1="106" y1="138" x2="130" y2="132" stroke="#d4c5a0" stroke-width="2" opacity="0.6"/>
        <line x1="106" y1="138" x2="128" y2="144" stroke="#d4c5a0" stroke-width="2" opacity="0.6"/>
        <line x1="106" y1="138" x2="135" y2="137" stroke="#d4c5a0" stroke-width="1.5" opacity="0.4"/>
      </g>

      <!-- SMOKE after shot -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;0;0;0.4;0.3;0.15;0" dur="8s" repeatCount="indefinite"/>
        <circle cx="105" cy="132" r="5" fill="#5c4d35" opacity="0.3">
          <animate attributeName="cy" values="132;120;108" dur="4s" repeatCount="indefinite"/>
          <animate attributeName="r" values="5;10;15" dur="4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.3;0.15;0" dur="4s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- Neck -->
      <rect x="-5" y="145" width="10" height="12" rx="2" fill="#5c4d35"/>
      <!-- Head -->
      <ellipse cx="0" cy="133" rx="14" ry="16" fill="#5c4d35"/>
      <!-- Bandana -->
      <rect x="-12" y="139" width="24" height="8" rx="2" fill="#3d3425" opacity="0.4"/>
      <!-- Eyes — confident squint -->
      <line x1="-7" y1="130" x2="-2" y2="130" stroke="#d4c5a0" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="2" y1="130" x2="7" y2="130" stroke="#d4c5a0" stroke-width="1.8" stroke-linecap="round"/>
      <!-- HAT -->
      <ellipse cx="0" cy="119" rx="30" ry="7" fill="#1a1510"/>
      <rect x="-16" y="99" width="32" height="22" rx="5" fill="#1a1510"/>
      <rect x="-16" y="115" width="32" height="3.5" fill="#3d3425"/>
      <path d="M -9 99 Q 0 106 9 99" fill="#13110d"/>

      <!-- WINNER label -->
      <text x="0" y="285" text-anchor="middle" font-family="'Georgia', serif" font-weight="700" font-size="13" fill="#a89770" letter-spacing="4" font-variant="small-caps">★ THE DEVELOPER ★</text>
    </g>

    <!-- ═══════════════════════════════════════════════ -->
    <!-- RIGHT — THE AI — DEFEATED, FALLING BACK        -->
    <!-- ═══════════════════════════════════════════════ -->
    <g transform="translate(700, 0)">
      <!-- The whole AI tips backward when hit -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0,0,255;0,0,255;0,0,255;-8,0,255;-18,0,255;-18,0,255;-10,0,255;0,0,255" dur="8s" repeatCount="indefinite"/>

        <!-- Shadow -->
        <ellipse cx="0" cy="258" rx="40" ry="5" fill="#000" opacity="0.35"/>

        <!-- Body — monolith -->
        <rect x="-18" y="155" width="36" height="62" rx="3" fill="#1a1510" stroke="#2a2218" stroke-width="0.5"/>
        <line x1="-10" y1="170" x2="10" y2="170" stroke="#3d3425" stroke-width="0.5" opacity="0.4"/>
        <line x1="-10" y1="180" x2="10" y2="180" stroke="#3d3425" stroke-width="0.5" opacity="0.4"/>
        <line x1="0" y1="160" x2="0" y2="190" stroke="#3d3425" stroke-width="0.5" opacity="0.3"/>

        <!-- Core — flickers and dies -->
        <circle cx="0" cy="180" r="4" fill="#3d3425">
          <animate attributeName="opacity" values="0.5;0.7;0.5;0.5;0.3;0.1;0.05;0.5" dur="8s" repeatCount="indefinite"/>
        </circle>

        <!-- Legs -->
        <rect x="-12" y="217" width="7" height="40" rx="1" fill="#13110d" stroke="#2a2218" stroke-width="0.3"/>
        <rect x="5" y="217" width="7" height="40" rx="1" fill="#13110d" stroke="#2a2218" stroke-width="0.3"/>
        <rect x="-14" y="253" width="11" height="6" rx="1" fill="#1a1510"/>
        <rect x="3" y="253" width="11" height="6" rx="1" fill="#1a1510"/>

        <!-- Left arm — drops weapon -->
        <line x1="-18" y1="165" x2="-35" y2="183" stroke="#1a1510" stroke-width="6" stroke-linecap="round"/>
        <line x1="-35" y1="183" x2="-40" y2="198" stroke="#1a1510" stroke-width="5" stroke-linecap="round">
          <!-- Arm goes limp on hit -->
          <animate attributeName="y2" values="198;198;198;210;225;225;215;198" dur="8s" repeatCount="indefinite"/>
        </line>

        <!-- Right arm -->
        <line x1="18" y1="165" x2="34" y2="193" stroke="#1a1510" stroke-width="6" stroke-linecap="round"/>

        <!-- DROPPED WEAPON (falls to ground) -->
        <rect x="-55" y="195" width="15" height="5" rx="1" fill="#2a2218" opacity="0.6">
          <animate attributeName="y" values="195;195;195;210;250;250;230;195" dur="8s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.6;0.6;0.6;0.5;0.4;0.4;0.5;0.6" dur="8s" repeatCount="indefinite"/>
          <animateTransform attributeName="transform" type="rotate" values="0;0;0;15;35;35;20;0" dur="8s" repeatCount="indefinite"/>
        </rect>

        <!-- Neck -->
        <rect x="-6" y="145" width="12" height="12" rx="2" fill="#1a1510"/>
        <!-- Head — tilts back on hit -->
        <rect x="-15" y="115" width="30" height="32" rx="4" fill="#1a1510" stroke="#2a2218" stroke-width="0.5"/>
        <!-- Visor flickers off -->
        <rect x="-11" y="127" width="22" height="4" rx="1" fill="#3d3425">
          <animate attributeName="opacity" values="0.6;0.8;0.6;0.6;0.2;0.05;0.05;0.6" dur="8s" repeatCount="indefinite"/>
        </rect>
        <!-- Antenna -->
        <line x1="0" y1="115" x2="0" y2="103" stroke="#2a2218" stroke-width="1.5"/>
        <circle cx="0" cy="101" r="2.5" fill="#3d3425">
          <animate attributeName="opacity" values="0.5;0.8;0.5;0.5;0.15;0.05;0.05;0.5" dur="8s" repeatCount="indefinite"/>
        </circle>

        <!-- HIT SPARK on AI body -->
        <g opacity="0">
          <animate attributeName="opacity" values="0;0;0;1;0.5;0;0;0" dur="8s" repeatCount="indefinite"/>
          <circle cx="-5" cy="170" r="6" fill="#d4c5a0" opacity="0.8">
            <animate attributeName="r" values="4;10;4" dur="0.1s" repeatCount="indefinite"/>
          </circle>
          <line x1="-5" y1="170" x2="-15" y2="160" stroke="#d4c5a0" stroke-width="1" opacity="0.5"/>
          <line x1="-5" y1="170" x2="5" y2="160" stroke="#d4c5a0" stroke-width="1" opacity="0.5"/>
          <line x1="-5" y1="170" x2="-12" y2="178" stroke="#d4c5a0" stroke-width="1" opacity="0.4"/>
        </g>
      </g>

      <!-- DEFEATED label -->
      <text x="0" y="285" text-anchor="middle" font-family="'Georgia', serif" font-size="11" fill="#3d3425" letter-spacing="3" font-variant="small-caps" opacity="0.6">THE AI</text>
    </g>

    <!-- ═══ VS TEXT ═══ -->
    <text x="450" y="200" text-anchor="middle" font-family="'Georgia', 'Times New Roman', serif" font-weight="700" font-size="36" fill="#3d3425" filter="url(#glow)" opacity="0.6">
      VS
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
    </text>

    <!-- ═══ WIND-BLOWN DUST ═══ -->
    <circle r="2" fill="#3d3425" opacity="0.3"><animate attributeName="cx" values="-20;920" dur="7s" repeatCount="indefinite"/><animate attributeName="cy" values="235;230;237;232" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.3;0.2;0" dur="7s" repeatCount="indefinite"/></circle>
    <circle r="1.2" fill="#2a2218" opacity="0.25"><animate attributeName="cx" values="-40;920" dur="5s" repeatCount="indefinite"/><animate attributeName="cy" values="245;240;247" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.25;0.15;0" dur="5s" repeatCount="indefinite"/></circle>
    <circle r="1.8" fill="#3d3425" opacity="0.2"><animate attributeName="cx" values="-60;920" dur="9s" repeatCount="indefinite"/><animate attributeName="cy" values="240;233;243;235" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.2;0.1;0" dur="9s" repeatCount="indefinite"/></circle>
    <circle r="0.9" fill="#5c4d35" opacity="0.3"><animate attributeName="cx" values="-30;920" dur="6s" repeatCount="indefinite"/><animate attributeName="cy" values="225;220;227" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.3;0.1;0" dur="6s" repeatCount="indefinite"/></circle>
    <circle r="1.5" fill="#2a2218" opacity="0.2"><animate attributeName="cx" values="-50;920" dur="11s" repeatCount="indefinite"/><animate attributeName="cy" values="248;242;250" dur="11s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.2;0.1;0" dur="11s" repeatCount="indefinite"/></circle>

    <!-- Tumbleweed -->
    <g><animateTransform attributeName="transform" type="translate" values="-80,0;960,0" dur="18s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="0,0,247;1080,0,247" dur="6s" repeatCount="indefinite"/><circle cx="0" cy="247" r="8" fill="none" stroke="#2a2218" stroke-width="0.8" opacity="0.3"/><line x1="-5" y1="247" x2="5" y2="247" stroke="#2a2218" stroke-width="0.4" opacity="0.2"/><line x1="0" y1="242" x2="0" y2="252" stroke="#2a2218" stroke-width="0.4" opacity="0.2"/></g></g>

    <!-- BOTTOM TEXT -->
    <text x="450" y="318" text-anchor="middle" font-family="'Georgia', serif" font-style="italic" font-size="14" fill="#a89770" letter-spacing="5" opacity="0.7">
      THE DEVELOPER WINS
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="342" text-anchor="middle" font-family="'Georgia', serif" font-size="9" fill="#3d3425" letter-spacing="4">
      HUMAN CREATIVITY  ★  DEFEATS  ★  ARTIFICIAL INTELLIGENCE
    </text>
  </g>

  <!-- Vignette -->
  <rect width="900" height="360" fill="url(#vig)"/>
  <!-- Grain -->
  <rect width="900" height="360" filter="url(#grn)" opacity="0.1" fill="transparent"/>
  <!-- Film scratches -->
  <rect x="350" y="0" width="1" height="360" fill="#fff" opacity="0"><animate attributeName="opacity" values="0;0;0.04;0;0;0;0.03;0;0;0" dur="3s" repeatCount="indefinite"/><animate attributeName="x" values="350;550;200;700;350" dur="3s" repeatCount="indefinite"/></rect>
</svg>
