\1
  <defs>
    <!-- CRT Glow Filter -->
    <filter id="crt-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Blinking Cursor Keyframes -->
    <style>
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor {
        animation: blink 1.2s infinite;
        fill: #39ff14;
      }
    </style>
    <!-- CRT Scanline Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.5" opacity="0.35" />
    </pattern>
  </defs>
  <rect x="0.5" y="0.5" width="1412" height="823" rx="8" fill="#000000" stroke="#00ff00" stroke-width="2"/>
  <g filter="url(#crt-glow)">
