<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
  <defs>
    <!-- Film grain noise -->
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="grainy"/>
      <!-- Vignette -->
      <feComponentTransfer in="grainy">
        <feFuncA type="linear" slope="0.92"/>
      </feComponentTransfer>
    </filter>

    <!-- Projector flicker -->
    <filter id="flicker">
      <feComponentTransfer>
        <feFuncR type="linear" slope="1">
          <animate attributeName="slope" values="1;0.92;1;0.96;1;0.94;1" dur="0.8s" repeatCount="indefinite"/>
        </feFuncR>
        <feFuncG type="linear" slope="1">
          <animate attributeName="slope" values="1;0.92;1;0.96;1;0.94;1" dur="0.8s" repeatCount="indefinite"/>
        </feFuncG>
        <feFuncB type="linear" slope="1">
          <animate attributeName="slope" values="1;0.92;1;0.96;1;0.94;1" dur="0.8s" repeatCount="indefinite"/>
        </feFuncB>
      </feComponentTransfer>
    </filter>

    <!-- Old film sepia tint -->
    <filter id="sepia">
      <feColorMatrix type="matrix" values="0.393 0.769 0.189 0 0
                                            0.349 0.686 0.168 0 0
                                            0.272 0.534 0.131 0 0
                                            0     0     0     1 0"/>
    </filter>

    <!-- Dramatic text glow -->
    <filter id="textglow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Radial vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="70%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.7"/>
    </radialGradient>

    <!-- Film scratch animation -->
    <linearGradient id="scratch" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="48%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="52%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Main film frame -->
  <g filter="url(#flicker)">
    <!-- Dark background -->
    <rect width="900" height="320" fill="#0c0a08"/>

    <!-- Warm dark tone -->
    <rect width="900" height="320" fill="#1a1510" opacity="0.7"/>

    <!-- ═══ FILM SPROCKET HOLES (left) ═══ -->
    <rect x="8" y="15" width="14" height="10" rx="2" fill="#0c0a08" stroke="#2a2218" stroke-width="1"/>
    <rect x="8" y="40" width="14" height="10" rx="2" fill="#0c0a08" stroke="#2a2218" stroke-width="1"/>
    <rect x="8" y="65" width="14" height="10" rx="2" fill="#0c0a08" stroke="#2a2218" stroke-width="1"/>
    <rect x="8" y="90" width="14" height="10" rx="2" fill="#0c0a08" stroke="#2a2218" stroke-width="1"/>
    <rect x="8" y="115" width="14" height="10" rx="2" fill="#0c0a08" stroke="#2a2218" stroke-width="1"/>
    <rect x="8" y="140" width="14" height="10" rx="2" fill="#0c0a08" stroke="#2a2218" stroke-width="1"/>
    <rect x="8" y="165" width="14" height="10" rx="2" fill="#0c0a08" stroke="#2a2218" stroke-width="1"/>
    <rect x="8" y="190" width="14" height="10" rx="2" fill="#0c0a08" stroke="#2a2218" stroke-width="1"/>
    <rect x="8" y="215" width="14" height="10" rx="2" fill="#0c0a08" stroke="#2a2218" stroke-width="1"/>
    <rect x="8" y="240" width="14" height="10" rx="2" fill="#0c0a08" stroke="#2a2218" stroke-width="1"/>
    <rect x="8" y="265" width="14" height="10" rx="2" fill="#0c0a08" stroke="#2a2218" stroke-width="1"/>
    <rect x="8" y="290" width="14" height="10" rx="2" fill="#0c0a08" stroke="#2a2218" stroke-width="1"/>

    <!-- ═══ FILM SPROCKET HOLES (right) ═══ -->
    <rect x="878" y="15" width="14" height="10" rx="2" fill="#0c0a08" stroke="#2a2218" stroke-width="1"/>
    <rect x="878" y="40" width="14" height="10" rx="2" fill="#0c0a08" stroke="#2a2218" stroke-width="1"/>
    <rect x="878" y="65" width="14" height="10" rx="2" fill="#0c0a08" stroke="#2a2218" stroke-width="1"/>
    <rect x="878" y="90" width="14" height="10" rx="2" fill="#0c0a08" stroke="#2a2218" stroke-width="1"/>
    <rect x="878" y="115" width="14" height="10" rx="2" fill="#0c0a08" stroke="#2a2218" stroke-width="1"/>
    <rect x="878" y="140" width="14" height="10" rx="2" fill="#0c0a08" stroke="#2a2218" stroke-width="1"/>
    <rect x="878" y="165" width="14" height="10" rx="2" fill="#0c0a08" stroke="#2a2218" stroke-width="1"/>
    <rect x="878" y="190" width="14" height="10" rx="2" fill="#0c0a08" stroke="#2a2218" stroke-width="1"/>
    <rect x="878" y="215" width="14" height="10" rx="2" fill="#0c0a08" stroke="#2a2218" stroke-width="1"/>
    <rect x="878" y="240" width="14" height="10" rx="2" fill="#0c0a08" stroke="#2a2218" stroke-width="1"/>
    <rect x="878" y="265" width="14" height="10" rx="2" fill="#0c0a08" stroke="#2a2218" stroke-width="1"/>
    <rect x="878" y="290" width="14" height="10" rx="2" fill="#0c0a08" stroke="#2a2218" stroke-width="1"/>

    <!-- Film strip borders -->
    <line x1="30" y1="0" x2="30" y2="320" stroke="#2a2218" stroke-width="1.5"/>
    <line x1="870" y1="0" x2="870" y2="320" stroke="#2a2218" stroke-width="1.5"/>

    <!-- ═══ CONTENT AREA ═══ -->

    <!-- Decorative western star -->
    <text x="450" y="42" text-anchor="middle" font-size="14" fill="#6b5c3e" opacity="0.6">★ ─── ★ ─── ★ ─── ★ ─── ★</text>

    <!-- Studio text -->
    <text x="450" y="72" text-anchor="middle" font-family="'Georgia', 'Times New Roman', serif" font-size="11" fill="#8b7d62" letter-spacing="12" font-variant="small-caps">
      A GITHUB PRODUCTION
    </text>

    <!-- Main title -->
    <text x="450" y="135" text-anchor="middle" font-family="'Georgia', 'Palatino Linotype', 'Book Antiqua', serif" font-weight="700" font-size="62" fill="#d4c5a0" filter="url(#textglow)" letter-spacing="8">
      PRINCE KUMAR
    </text>

    <!-- Subtitle line -->
    <line x1="180" y1="155" x2="720" y2="155" stroke="#6b5c3e" stroke-width="0.8" opacity="0.5"/>

    <!-- Tagline -->
    <text x="450" y="185" text-anchor="middle" font-family="'Georgia', serif" font-style="italic" font-size="18" fill="#a89770" letter-spacing="4" opacity="0.9">
      "The Code Wrangler"
    </text>

    <!-- Role line -->
    <text x="450" y="218" text-anchor="middle" font-family="'Georgia', serif" font-size="12" fill="#7a6d52" letter-spacing="6">
      BUILDER  ·  CREATOR  ·  PIONEER
    </text>

    <!-- Decorative western ornament -->
    <text x="450" y="250" text-anchor="middle" font-size="16" fill="#6b5c3e" opacity="0.5">━━━━━━━━━━━━━━━━━━━━━━━━━━━━</text>

    <!-- Coming soon style -->
    <text x="450" y="278" text-anchor="middle" font-family="'Georgia', serif" font-size="10" fill="#6b5c3e" letter-spacing="8">
      NOW SHOWING AT
    </text>
    <text x="450" y="298" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#a89770" letter-spacing="2">
      github.com/Prince452707
    </text>

    <!-- Bottom stars -->
    <text x="450" y="316" text-anchor="middle" font-size="10" fill="#6b5c3e" opacity="0.5">★ ★ ★</text>
  </g>

  <!-- Vignette overlay -->
  <rect width="900" height="320" fill="url(#vignette)"/>

  <!-- Film grain overlay -->
  <rect width="900" height="320" filter="url(#grain)" opacity="0.15" fill="transparent"/>

  <!-- Animated film scratch line -->
  <rect x="340" y="0" width="1" height="320" fill="#fff" opacity="0">
    <animate attributeName="opacity" values="0;0;0.06;0;0;0;0;0.04;0;0" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="x" values="340;500;200;650;340" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="600" y="0" width="1" height="320" fill="#fff" opacity="0">
    <animate attributeName="opacity" values="0;0.05;0;0;0;0;0.03;0;0;0" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="600;300;700;450;600" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
